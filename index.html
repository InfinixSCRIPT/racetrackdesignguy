<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackForge F1</title><link rel="stylesheet" href="style.css"></head><body><header><b>Track<span>Forge</span> F1</b><small>Pist tasarla ve sür</small><nav><button id="newBtn">Yeni</button><button id="undoBtn">Geri al</button><button id="closeBtn">Pisti kapat</button><button id="connectBtn">Bağla</button><button id="zoomOutBtn">−</button><button id="zoomInBtn">＋</button><button id="saveBtn">JSON indir</button><button id="loadBtn">JSON aç</button><input id="fileInput" type="file" accept=".json" hidden><button id="raceBtn" class="primary">3D Sür</button></nav></header><main><aside><h3>Pist editörü</h3><p>Tuvale tıklayarak nokta ekle. Noktaları sürükle. Bağla modunda önce 17, sonra 1 gibi iki noktaya tıkla.</p><button data-template="oval">Oval</button> <button data-template="f1">F1</button><button data-template="technical">Teknik</button><label>Grid <input id="gridToggle" type="checkbox" checked></label><label>Yol genişliği <input id="widthRange" type="range" min="3" max="10" value="6"></label><p>Yarış: W/↑ gaz, S/↓ fren, A/D direksiyon, ESC çıkış.</p></aside><section id="stage"><canvas id="editorCanvas"></canvas><canvas id="gameCanvas"></canvas><strong id="modeBadge">Editör</strong></section><aside><h3>Analiz</h3><div class="cards"><div><b id="pointCount">0</b><small>Nokta</small></div><div><b id="lengthStat">0.00 km</b><small>Uzunluk</small></div><div><b id="turnStat">0</b><small>Viraj</small></div><div><b id="lapStat">--</b><small>F1 turu</small></div></div><p>Durum: <b id="status">Tasarlanıyor</b></p><p>Bağlantı: <b id="linkStat">0</b></p></aside></main><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="track-editor.js"></script><script src="f1-car.js"></script><script src="racing.js"></script><script src="app.js"></script></body></html>
